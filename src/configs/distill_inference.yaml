defaults:
  - /model: student_forecasting
  - /metrics: forecasting
  - /datasets: ett_etth1_h96
  - /dataloader: smoke
  - /transforms: forecasting_auto
  - _self_

model:
  in_channels: 7
  horizon: 96

inferencer:
  device_tensors: ["inputs", "targets"]
  device: auto
  require_cuda: false
  save_path: "distill_predictions"
  seed: 42
  from_pretrained: "saved/distill_train/model_best.pth"

dataloader:
  batch_size: 64
  num_workers: 4

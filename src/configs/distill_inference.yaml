defaults:
  - /model: student_classification
  - /metrics: classification
  - /datasets: ucr_gunpoint
  - /dataloader: smoke
  - /transforms: plain
  - _self_

model:
  in_channels: 1
  n_classes: 2

inferencer:
  device_tensors: ["inputs", "targets"]
  device: auto
  require_cuda: false
  save_path: "distill_predictions"
  seed: 42
  from_pretrained: "saved/distill_train/model_best.pth"

dataloader:
  batch_size: 64
  num_workers: 2

defaults:
  - /task: forecasting
  - /model: tsfm_forecast_adapter
  - /metrics: forecasting
  - /datasets: ett_etth1_h720
  - /dataloader: smoke
  - /transforms: plain
  - _self_

model:
  provider: "chronos"
  model_id: "amazon/chronos-bolt-base"
  in_channels: 7
  horizon: 720

inferencer:
  device_tensors: ${task.device_tensors}
  device: auto
  require_cuda: false
  save_path: "fm_etth1_h720_predictions"
  seed: 42
  from_pretrained: "saved/fm_etth1_h720_train/model_best.pth"

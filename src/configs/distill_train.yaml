defaults:
  - /model: student_classification
  - /writer: cometml
  - /metrics: classification
  - /datasets: ucr_gunpoint
  - /dataloader: smoke
  - /transforms: plain
  - /loss_function: classification_distill
  - /distillation: hybrid
  - _self_

model:
  in_channels: 1
  n_classes: 2

optimizer:
  _target_: torch.optim.Adam
  lr: 3e-4

lr_scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  gamma: 0.9
  step_size: ${trainer.epoch_len}

trainer:
  log_step: 1
  n_epochs: 10
  epoch_len: null
  grad_accum_steps: 1
  amp_enabled: true
  amp_dtype: "bf16"
  compile_enabled: false
  compile_backend: null
  compile_mode: null
  compile_dynamic: null
  compile_fullgraph: null
  compile_distillation: false
  device_tensors: ["inputs", "targets"]
  resume_from: null
  device: auto
  require_cuda: false
  override: true
  monitor: "max val_MacroF1"
  save_period: 1
  early_stop: ${trainer.n_epochs}
  save_dir: "saved"
  seed: 42

writer:
  run_name: "distill_train"
  description: "Base distillation run for classification student."
  tags: ["classification", "distill", "train"]

distillation:
  enabled: true
  input_key: inputs
  student_hidden_dim: 128
  student_pred_dim: 2
  teacher_backend: mock
  teacher_hidden_dim: 256
  teacher_layer_idx: -1

dataloader:
  batch_size: 64
  num_workers: 2

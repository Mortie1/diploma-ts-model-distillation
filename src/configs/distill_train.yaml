defaults:
  - /model: student_forecasting
  - /writer: cometml
  - /metrics: forecasting
  - /datasets: ett_etth1_h96
  - /dataloader: smoke
  - /transforms: plain
  - /loss_function: forecasting_distill
  - /distillation: hybrid
  - _self_

model:
  in_channels: 7
  horizon: 96

optimizer:
  _target_: torch.optim.Adam
  lr: 3e-4

lr_scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  gamma: 0.9
  step_size: ${trainer.epoch_len}

trainer:
  log_step: 1
  n_epochs: 10
  epoch_len: null
  amp_enabled: true
  amp_dtype: "bf16"
  compile_enabled: false
  compile_backend: null
  compile_mode: null
  compile_dynamic: null
  compile_fullgraph: null
  compile_distillation: false
  device_tensors: ["context", "target"]
  resume_from: null
  device: auto
  require_cuda: false
  override: true
  monitor: "min test_MAE"
  save_period: 1
  early_stop: ${trainer.n_epochs}
  save_dir: "saved"
  seed: 42

writer:
  run_name: "distill_train"
  auto_name: true
  short_name: "forecasting-distill"
  main_change: "base"
  description: "Base distillation run for forecasting student."
  tags: ["forecasting", "distill", "train"]

distillation:
  enabled: true
  input_key: context
  student_hidden_dim: 128
  student_pred_dim: 672
  teacher_backend: mock
  teacher_hidden_dim: 256

dataloader:
  batch_size: 64
  num_workers: 4

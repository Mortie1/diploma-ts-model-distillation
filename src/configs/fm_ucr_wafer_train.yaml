defaults:
  - /task: classification
  - /model: tsfm_classification_adapter
  - /writer: local
  - /metrics: classification
  - /datasets: ucr_wafer
  - /dataloader: smoke
  - /transforms: plain
  - /loss_function: classification
  - /distillation: hybrid
  - _self_

model:
  provider: "moment"
  model_id: "momentfm/MOMENT-1-large"
  n_classes: 2
  in_channels: 1

optimizer:
  _target_: torch.optim.Adam
  lr: 3e-4

lr_scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  gamma: 0.9
  step_size: 100

trainer:
  log_step: 50
  n_epochs: 10
  epoch_len: null
  device_tensors: ${task.device_tensors}
  resume_from: null
  device: auto
  require_cuda: false
  override: True
  monitor: "max test_Accuracy"
  save_period: 1
  early_stop: ${trainer.n_epochs}
  save_dir: "saved"
  seed: 42

writer:
  run_name: "fm_ucr_wafer_train"

defaults:
  - /task: forecasting
  - /model: tsfm_forecast_adapter
  - /metrics: forecasting
  - /datasets: ett_etth1_h96
  - /dataloader: smoke
  - /transforms: plain
  - _self_

model:
  provider: "moment"
  model_id: "AutonLab/MOMENT-1-large"
  in_channels: 7
  horizon: 96
  require_provider_model: true
  finetune_mode: "full"

inferencer:
  device_tensors: ${task.device_tensors}
  device: auto
  require_cuda: false
  save_path: "fm_etth1_h96_moment_full_predictions"
  seed: 42
  from_pretrained: "saved/fm_etth1_h96_moment_full_train/model_best.pth"

defaults:
  - /model: tsfm_forecast_adapter
  - /writer: cometml
  - /metrics: forecasting
  - /datasets: ett_etth1_h96
  - /dataloader: smoke
  - /transforms: forecasting_auto
  - /loss_function: forecasting
  - _self_

model:
  model_id: "amazon/chronos-2"
  in_channels: 7
  horizon: 96
  require_provider_model: false
  finetune_mode: "none"

optimizer:
  _target_: torch.optim.Adam
  lr: 1e-3

lr_scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  gamma: 0.9
  step_size: 200

trainer:
  log_step: 1
  n_epochs: 10
  epoch_len: null
  amp_enabled: true
  amp_dtype: "bf16"
  compile_enabled: false
  compile_backend: null
  compile_mode: null
  compile_dynamic: null
  compile_fullgraph: null
  compile_distillation: false
  device_tensors: ["inputs", "targets"]
  resume_from: null
  device: auto
  require_cuda: false
  override: true
  monitor: "min test_MAE"
  save_period: 1
  early_stop: ${trainer.n_epochs}
  save_dir: "saved"
  seed: 42

writer:
  run_name: "fm_forecasting_train"
  auto_name: true
  short_name: "forecasting-fm"
  main_change: "base"
  description: "Base FM forecasting run."
  tags: ["forecasting", "fm", "train"]

dataloader:
  batch_size: 64
  num_workers: 4

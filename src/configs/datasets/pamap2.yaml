train:
  _target_: src.datasets.PAMAP2Dataset
  root: "data/raw/pamap2"
  split: "train"
  window_length: 256
  stride: 128
  feature_set: "acc_gyro"
  include_hr: false
  normalize: true
  min_majority_ratio: 0.6
  instance_transforms: ${transforms.instance_transforms.train}
val:
  _target_: src.datasets.PAMAP2Dataset
  root: "data/raw/pamap2"
  split: "val"
  window_length: 256
  stride: 128
  feature_set: "acc_gyro"
  include_hr: false
  normalize: true
  min_majority_ratio: 0.6
  instance_transforms: ${transforms.instance_transforms.inference}
test:
  _target_: src.datasets.PAMAP2Dataset
  root: "data/raw/pamap2"
  split: "test"
  window_length: 256
  stride: 128
  feature_set: "acc_gyro"
  include_hr: false
  normalize: true
  min_majority_ratio: 0.6
  instance_transforms: ${transforms.instance_transforms.inference}

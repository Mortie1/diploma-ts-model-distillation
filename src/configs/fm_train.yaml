defaults:
  - /model: classification_adapter
  - /writer: cometml
  - /metrics: classification
  - /datasets: pamap2
  - /dataloader: smoke
  - /transforms: plain
  - /loss_function: classification
  - _self_

optimizer:
  _target_: torch.optim.Adam
  lr: 3e-4

lr_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: auto
  eta_min: 0.0

trainer:
  log_step: 10
  n_epochs: 10
  epoch_len: null
  grad_accum_steps: 1
  warmup_ratio: 0.1
  warmup_steps: null
  warmup_start_factor: 0.1
  amp_enabled: false
  amp_dtype: "bf16"
  compile_enabled: null
  compile_backend: null
  compile_mode: null
  compile_dynamic: null
  compile_fullgraph: null
  compile_distillation: false
  device_tensors: ["inputs", "targets"]
  resume_from: null
  device: auto
  require_cuda: true
  override: true
  monitor: "max val_MacroF1"
  save_period: 1
  save_trainable_only: true
  save_teacher_state: false
  early_stop: ${trainer.n_epochs}
  save_dir: "saved"
  seed: 42

writer:
  run_name: "increase bs to 64"
  tags: ["classification", "moment", "pamap"]

dataloader:
  batch_size: 64
  num_workers: 4

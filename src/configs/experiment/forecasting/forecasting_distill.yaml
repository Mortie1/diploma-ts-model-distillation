defaults:
  - /model: student_forecasting
  - /writer: cometml
  - /metrics: forecasting
  - /datasets: smoke_forecasting
  - /dataloader: smoke
  - /transforms: forecasting_auto
  - /loss_function: forecasting_distill
  - /distillation: hybrid
  - _self_

optimizer:
  _target_: torch.optim.Adam
  lr: 3e-4

lr_scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  gamma: 0.9
  step_size: ${trainer.epoch_len}

trainer:
  log_step: 10
  n_epochs: 5
  epoch_len: 20
  device_tensors: ["context", "target"]
  resume_from: null
  device: auto
  require_cuda: false
  override: True
  monitor: "min test_MAE"
  save_period: 1
  early_stop: ${trainer.n_epochs}
  save_dir: "saved"
  seed: 42

distillation:
  enabled: true
  input_key: context
  student_hidden_dim: 128
  student_pred_dim: 24
  teacher_backend: mock
  teacher_hidden_dim: 256

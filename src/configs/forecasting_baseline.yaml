defaults:
  - /model: student_forecasting
  - /writer: cometml
  - /metrics: forecasting
  - /datasets: smoke_forecasting
  - /dataloader: smoke
  - /transforms: plain
  - /loss_function: forecasting
  - /distillation: hybrid
  - _self_

optimizer:
  _target_: torch.optim.Adam
  lr: 3e-4

lr_scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  gamma: 0.9
  step_size: ${trainer.epoch_len}

trainer:
  log_step: 10
  n_epochs: 5
  epoch_len: 20
  compile_enabled: false
  compile_backend: null
  compile_mode: null
  compile_dynamic: null
  compile_fullgraph: null
  compile_distillation: false
  device_tensors: ["context", "target"]
  resume_from: null
  device: auto
  require_cuda: false
  override: True
  monitor: "min test_MAE"
  save_period: 1
  early_stop: ${trainer.n_epochs}
  save_dir: "saved"
  seed: 42

writer:
  run_name: "forecasting_baseline"
  auto_name: true
  short_name: "forecasting-student"
  main_change: "base"
  description: "Base student-only forecasting baseline."
  tags: ["forecasting", "baseline", "train"]

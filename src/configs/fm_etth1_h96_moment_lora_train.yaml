defaults:
  - /task: forecasting
  - /model: tsfm_forecast_adapter
  - /writer: local
  - /metrics: forecasting
  - /datasets: ett_etth1_h96
  - /dataloader: smoke
  - /transforms: plain
  - /loss_function: forecasting
  - /distillation: hybrid
  - _self_

model:
  provider: "moment"
  model_id: "AutonLab/MOMENT-1-large"
  in_channels: 7
  horizon: 96
  require_provider_model: true
  finetune_mode: "lora"
  lora_rank: 8
  lora_alpha: 16.0
  lora_dropout: 0.05
  lora_target_patterns: ["*q*", "*k*", "*v*", "*out*", "*proj*", "*fc*"]

optimizer:
  _target_: torch.optim.Adam
  lr: 3e-4

lr_scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  gamma: 0.95
  step_size: 200

trainer:
  log_step: 50
  n_epochs: 3
  epoch_len: null
  device_tensors: ${task.device_tensors}
  resume_from: null
  device: auto
  require_cuda: false
  override: True
  monitor: "min test_MAE"
  save_period: 1
  early_stop: ${trainer.n_epochs}
  save_dir: "saved"
  seed: 42

writer:
  run_name: "fm_etth1_h96_moment_lora_train"
